spring:
  application:
    name: pr-guard
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  port: ${SERVER_PORT:8080}
prguard:
  app-base-url: ${APP_BASE_URL}
  github:
    webhook:
      secret: ${PRGUARD_GITHUB_WEBHOOK_SECRET:}
      require-signature: ${PRGUARD_REQUIRE_WEBHOOK_SIGNATURE:true}
    app:
      id: ${PRGUARD_GITHUB_APP_ID:}
      slug: ${PRGUARD_GITHUB_APP_SLUG:}
      private-key-base64: ${PRGUARD_GITHUB_PRIVATE_KEY_BASE64:}
      api-base-url: ${PRGUARD_GITHUB_API_BASE_URL:https://api.github.com}
      web-base-url: ${PRGUARD_GITHUB_WEB_BASE_URL:https://github.com}
